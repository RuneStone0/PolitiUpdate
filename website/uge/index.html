<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ugens overblik — PolitiUpdate</title>
  <link rel="canonical" href="https://politiupdates.dk/uge/">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="PolitiUpdate">
  <meta property="og:locale" content="da_DK">
  <meta property="og:title" content="Ugens overblik — PolitiUpdate">
  <meta property="og:description" content="Alle ugentlige overblik fra PolitiUpdate — politiets opdateringer samlet uge for uge.">
  <meta property="og:url" content="https://politiupdates.dk/uge/">
  <meta property="og:image" content="https://politiupdates.dk/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="PolitiUpdate — Ugens overblik — PolitiUpdate">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ugens overblik — PolitiUpdate">
  <meta name="twitter:description" content="Alle ugentlige overblik fra PolitiUpdate — politiets opdateringer samlet uge for uge.">
  <meta name="twitter:image" content="https://politiupdates.dk/og-image.png">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="digest.css">
  <link rel="stylesheet" href="https://sibforms.com/forms/end-form/build/sib-styles.css">
</head>
<body>
  <div class="digest-shell">
    <header class="digest-header">
      <a class="back-link" href="../">PolitiUpdate</a>
      <h1 id="digest-heading">Ugeoverblik</h1>
      <p class="digest-meta" id="digest-meta">Henter data…</p>
    </header>

    <main class="digest-main" id="digest-main">
      <p class="digest-loading">Henter ugens overblik…</p>
    </main>

    <footer class="digest-footer">
      <p>Ikke tilknyttet politiet &middot; Data fra <a href="https://via.ritzau.dk" target="_blank" rel="noopener">Ritzau</a></p>
    </footer>
  </div>

  <script>
    // This URL is the stable raw Gist URL — updated each Sunday by the digest container.
    // Replace this with your actual Gist URL after first run.
    const DIGEST_GIST_URL = 'https://gist.githubusercontent.com/RuneStone0/b9d8b2d9e42229749148b3b82ae4c003/raw/digest.json';

    const CAT_LABELS = {
      missing_person: 'Efterlysninger/savnede',
      witness_appeal: 'Vidneappeller',
      arrest: 'Anholdelser/sigtelser',
      other: 'Øvrige meddelelser',
    };

    const UNKNOWN_REGION = 'Ukendt';

    function renderCatItems(items) {
      return (items || [])
        .map(item => item.url
          ? `<li><a href="${escHtml(item.url)}" target="_blank" rel="noopener">${escHtml(item.title)}</a></li>`
          : `<li><span>${escHtml(item.title)}</span></li>`
        ).join('\n');
    }

    function renderAccordion(groups) {
      return groups.map(([label, items]) => `
        <details class="cat-item">
          <summary><span class="cat-count">${items.length}</span><span class="cat-label">${escHtml(label)}</span></summary>
          <ul class="cat-item-list">${renderCatItems(items)}</ul>
        </details>
      `).join('\n');
    }

    async function loadDigest() {
      const main = document.getElementById('digest-main');
      try {
        const resp = await fetch(DIGEST_GIST_URL, { cache: 'no-store' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();

        document.getElementById('digest-heading').textContent = `Uge ${data.week}, ${data.year}`;
        document.getElementById('digest-meta').textContent = `${data.total_posts} Opdateringer`;

        const cats = data.categories || {};
        const catItems = data.category_items || {};
        const categoryGroups = Object.entries(CAT_LABELS)
          .filter(([key]) => cats[key] > 0)
          .map(([key, label]) => [label, catItems[key] || []]);
        const categoryAccordionHtml = renderAccordion(categoryGroups);

        const regionItems = data.region_items || {};
        const regionGroups = Object.keys(regionItems)
          .filter(label => label !== UNKNOWN_REGION)
          .sort()
          .concat(regionItems[UNKNOWN_REGION] ? [UNKNOWN_REGION] : [])
          .map(label => [label, regionItems[label]]);
        const regionAccordionHtml = renderAccordion(regionGroups);

        const notable = data.notable || [];
        const notableRows = notable
          .map(n => `<li><a href="${escHtml(n.url)}" target="_blank" rel="noopener">${escHtml(n.title)}</a><p>${escHtml(n.summary)}</p></li>`)
          .join('\n');
        const notableSection = notableRows
          ? `<section class="digest-notable"><h2>Andre bemærkelsesværdige sager</h2><ul class="notable-list">${notableRows}</ul></section>`
          : '';

        const prevWeek = data.prev_week;
        const nextWeek = data.next_week;
        let pagerSection = '';
        if (prevWeek || nextWeek) {
          const prevLink = prevWeek
            ? `<a class="pager-link pager-prev" href="${prevWeek.year}/${prevWeek.week}/">&larr; Uge ${prevWeek.week}, ${prevWeek.year}</a>`
            : '';
          const nextLink = nextWeek
            ? `<a class="pager-link pager-next" href="${nextWeek.year}/${nextWeek.week}/">Uge ${nextWeek.week}, ${nextWeek.year} &rarr;</a>`
            : '';
          pagerSection = `<nav class="digest-pager">${prevLink}${nextLink}</nav>`;
        }

        main.innerHTML = `
          <article class="digest-narrative">
            <p>${data.narrative_html || escHtml(data.narrative || '')}</p>
          </article>
          ${notableSection}
          <section class="digest-signup">
            <p class="eyebrow">Nyhedsbrev</p>
            <h2>F&aring; ugens overblik i din indbakke</h2>
            <p class="digest-signup-copy">Gratis ugentligt overblik over politiets opdateringer fra hele Danmark. Tilmelding tager 10 sekunder, og du kan altid afmelde igen.</p>
          <div class="sib-form">
            <div id="sib-form-container" class="sib-form-container">
              <div id="error-message" class="sib-form-message-panel" style="font-family:Helvetica, sans-serif; font-size:16px; text-align:left; color:#661d1d; background-color:#ffeded; border-color:#ff4949; border-radius:8px;">
                <div class="sib-form-message-panel__text sib-form-message-panel__text--center">
                  <span class="sib-form-message-panel__inner-text">Din tilmelding kunne ikke gemmes. Prøv igen.</span>
                </div>
              </div>
              <div id="success-message" class="sib-form-message-panel" style="font-family:Helvetica, sans-serif; font-size:16px; text-align:left; color:#085229; background-color:#e7faf0; border-color:#13ce66; border-radius:8px;">
                <div class="sib-form-message-panel__text sib-form-message-panel__text--center">
                  <span class="sib-form-message-panel__inner-text">Din tilmelding er gennemført.</span>
                </div>
              </div>
              <div id="sib-container" class="sib-container--large sib-container--vertical" style="direction:ltr">
                <form id="sib-form" method="POST" action="https://2e5ae89a.sibforms.com/serve/MUIFAO_V6U8LWa9W0x0khEvDMVcOsFqcOzdxxNaavIe1y70gxaQ19XyGVj3UCCEsIv0vRNeDBJ6WbBMtv3YkgoXyqKcEl8Jx4LtwJu84r1ORITSE6qiNoDJOmFx0UDcxQe2ScbsG7PSdQqbUNl5JzLL2Ext4h7qKWWM2c0uvOUWjltpVS_HoVSd8antFv8-Kdbx7GGdi24KZuoURiw==" data-type="subscription">
                  <div style="padding: 8px 0;">
                    <div class="sib-input sib-form-block">
                      <div class="form__entry entry_block">
                        <div class="form__label-row">
                          <label class="entry__label" for="EMAIL" data-required="*">E-mailadresse</label>
                          <div class="entry__field">
                            <input class="input" type="text" id="EMAIL" name="EMAIL" autocomplete="off" value="" placeholder="din@email.dk" data-required="true" required />
                          </div>
                        </div>
                        <label class="entry__error entry__error--primary"></label>
                        <label class="entry__specification">Indtast en gyldig e-mailadresse. Eks. abc@xyz.dk</label>
                      </div>
                    </div>
                  </div>
                  <div style="padding: 8px 0;">
                    <div class="sib-form-block" style="text-align: left">
                      <button class="sib-form-block__button sib-form-block__button-with-loader" form="sib-form" type="submit">Tilmeld</button>
                    </div>
                  </div>
                  <input type="text" name="email_address_check" value="" class="input--hidden">
                  <input type="hidden" name="locale" value="en">
                </form>
              </div>
            </div>
          </div>
          </section>
          <section class="digest-breakdown" id="stats-section">
            <div class="stats-header">
              <h2>Statistik</h2>
              <div class="sort-toggle" role="group" aria-label="Sortér efter">
                <button type="button" class="sort-btn active" data-sort="category">Kategori</button>
                <button type="button" class="sort-btn" data-sort="region">Region</button>
              </div>
            </div>
            <div class="cat-list" data-panel="category">${categoryAccordionHtml}</div>
            <div class="cat-list" data-panel="region" hidden>${regionAccordionHtml}</div>
          </section>
          ${pagerSection}
        `;

        document.querySelectorAll('#stats-section .sort-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('#stats-section .sort-btn').forEach(b => b.classList.toggle('active', b === btn));
            const sort = btn.dataset.sort;
            document.querySelector('#stats-section [data-panel="category"]').hidden = sort !== 'category';
            document.querySelector('#stats-section [data-panel="region"]').hidden = sort !== 'region';
          });
        });
      } catch (err) {
        main.innerHTML = `<p class="digest-error">Kunne ikke hente ugens overblik. Prøv igen senere.</p>`;
        console.error('Digest fetch failed:', err);
      }
    }

    function escHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    loadDigest();
  </script>
<script defer src="https://sibforms.com/forms/end-form/build/main.js"></script>
</body>
</html>
