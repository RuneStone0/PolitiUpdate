name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: python -m pytest tests/ --ignore=tests/test_e2e.py -v --tb=short

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker compose -f docker-compose.test.yml build

      - name: Run unit tests in container
        run: docker compose -f docker-compose.test.yml run --rm test

      - name: Run e2e test in container
        run: docker compose -f docker-compose.test.yml run --rm e2e
