services:
  bot:
    image: ghcr.io/runestone0/politiupdate:latest
    restart: unless-stopped
    env_file:
      - stack.env
    volumes:
      - /mnt/data/politiupdate:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  x-stats:
    image: ghcr.io/runestone0/politiupdate:latest
    restart: "no"
    env_file:
      - stack.env
    volumes:
      - /mnt/data/politiupdate:/app/data
      - ./website:/app/website
    # Override the bot's default ENTRYPOINT so this service runs the stats
    # fetcher/publisher instead of the posting bot.
    entrypoint: ["python", "-m", "src.x_stats"]
    command: ["--refresh"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  followers:
    image: ghcr.io/runestone0/politiupdate:latest
    container_name: followers
    restart: "no"
    env_file:
      - stack.env
    volumes:
      - /mnt/data/politiupdate:/app/data
    # Override the bot's default ENTRYPOINT so this service follows back new
    # followers / unfollows lapsed ones instead of running the posting bot.
    # Run periodically (e.g. hourly cron via Portainer) — the X API v2
    # follow/followers endpoints are tightly rate-limited.
    entrypoint: ["python", "-m", "src.followers"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  weekly-post:
    image: ghcr.io/runestone0/politiupdate:latest
    container_name: weekly-post
    restart: "no"
    env_file:
      - stack.env
    volumes:
      - /mnt/data/politiupdate:/app/data
    entrypoint: ["python", "-m", "src.digest"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Daily health check across the other services (bot reachability/health,
  # failed-post backlog). Sends a Prowl notification only when something
  # looks wrong. Trigger on a daily schedule the same way weekly-post/x-stats
  # are triggered (host cron or Portainer), e.g. `docker compose run --rm notify-daily`.
  notify-daily:
    image: ghcr.io/runestone0/politiupdate:latest
    container_name: notify-daily
    restart: "no"
    env_file:
      - stack.env
    volumes:
      - /mnt/data/politiupdate:/app/data
    entrypoint: ["python", "-m", "src.notify"]
    command: ["daily"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Weekly (Sunday) notification with the change in X follower count since
  # the last run. Trigger e.g. `docker compose run --rm notify-weekly` on Sundays.
  notify-weekly:
    image: ghcr.io/runestone0/politiupdate:latest
    container_name: notify-weekly
    restart: "no"
    env_file:
      - stack.env
    volumes:
      - /mnt/data/politiupdate:/app/data
    entrypoint: ["python", "-m", "src.notify"]
    command: ["weekly"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
