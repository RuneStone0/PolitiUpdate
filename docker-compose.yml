services:
  bot:
    image: ghcr.io/runestone0/politiupdate:latest
    container_name: bot
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      # Failed posts older than this (since original publish) are given up
      # on instead of retried. Retries run every ~40 min (RETRY_EVERY_POLLS
      # in src/bot/main.py) — the code default of 1h only gave a failed
      # post ~1 retry attempt before a transient X API 503 got it dropped
      # as stale on 2026-08-20. 4h gives ~6 attempts of headroom instead.
      - MAX_ARTICLE_AGE_HOURS=4
    volumes:
      - /mnt/data/politiupdate:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Manual/on-demand only — notify's weekly job (see below) already refreshes
  # and publishes these stats on a schedule, reusing the same X API call
  # instead of running a second separately-scheduled fetch. Run this
  # directly (`docker compose --profile manual run --rm x-stats --refresh`)
  # if you want an immediate refresh outside notify's weekly cadence.
  #
  # `profiles: [manual]` keeps this out of the default `docker compose up`
  # set — without it, Portainer's GitOps polling (`docker compose up -d`
  # every 5m) restarts this exited one-shot container on every poll, and
  # since it has no idempotency guard (`--refresh` always republishes), that
  # hammered the GitHub Gist API into a 503 (~113 runs in 9.5h on 2026-08-17).
  x-stats:
    image: ghcr.io/runestone0/politiupdate:latest
    container_name: x-stats
    restart: "no"
    profiles: ["manual"]
    env_file:
      - stack.env
    volumes:
      - /mnt/data/politiupdate:/app/data
      - ./website:/app/website
    # Override the bot's default ENTRYPOINT so this service runs the stats
    # fetcher/publisher instead of the posting bot.
    entrypoint: ["python", "-m", "src.x_stats"]
    command: ["--refresh"]
    # The image's HEALTHCHECK probes bot's HTTP /health endpoint (port
    # 8080); this entrypoint never binds it. Only quietly harmless today
    # because the job exits before Docker's first probe fires — disable it
    # explicitly rather than relying on that timing.
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Manual/on-demand only — see x-stats above for why `profiles: [manual]`
  # is required (otherwise Portainer's GitOps polling restarts this every
  # 5m; it survived only because of its own "already posted" guard).
  weekly-post:
    image: ghcr.io/runestone0/politiupdate:latest
    container_name: weekly-post
    restart: "no"
    profiles: ["manual"]
    env_file:
      - stack.env
    volumes:
      - /mnt/data/politiupdate:/app/data
    entrypoint: ["python", "-m", "src.digest"]
    # See x-stats above: this entrypoint doesn't serve :8080/health either.
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Manual/on-demand only — see x-stats above for why `profiles: [manual]`
  # is required (otherwise Portainer's GitOps polling restarts this every
  # 5m; it survived only because of its own "scheduled post time" guard).
  feedback-post:
    image: ghcr.io/runestone0/politiupdate:latest
    container_name: feedback-post
    restart: "no"
    profiles: ["manual"]
    env_file:
      - stack.env
    volumes:
      - /mnt/data/politiupdate:/app/data
    entrypoint: ["python", "-m", "src.feedback"]
    # See x-stats above: this entrypoint doesn't serve :8080/health either.
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Persistent — self-schedules its own daily health check (bot
  # reachability/health, failed-post backlog) and weekly X-stats refresh +
  # follower-delta notification internally (see src/notify/loop.py), the
  # same way `bot` self-schedules its polling. No external cron, Portainer
  # scheduling, or GitHub Actions needed.
  notify:
    image: ghcr.io/runestone0/politiupdate:latest
    container_name: notify
    restart: unless-stopped
    env_file:
      - stack.env
    volumes:
      - /mnt/data/politiupdate:/app/data
    entrypoint: ["python", "-m", "src.notify"]
    # The image's HEALTHCHECK probes bot's HTTP /health endpoint (port
    # 8080), but notify's loop (src/notify/loop.py) never binds that port —
    # it's a background scheduler, not an HTTP service. Without this it
    # gets flagged "unhealthy" forever even when working correctly.
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
